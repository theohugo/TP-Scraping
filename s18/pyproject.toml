[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greenkart-scraper"
version = "0.1.0"
description = "TP individuel scraping - cible S18 (GreenKart, Rahul Shetty Academy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "playwright==1.61.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
greenkart-scraper = "greenkart_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
